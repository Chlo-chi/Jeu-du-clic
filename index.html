<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attrape les pièces</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #55bde9;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #55bde9;
}

#background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #55bde9;
    z-index: 1;
    pointer-events: none;
}

#coins {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 100;
    pointer-events: none;
}

.coin {
    position: absolute;
    top: 0;
    left: 0;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: radial-gradient(
        circle at 30% 25%,
        #fffbc0,
        #ffe04a 25%,
        #f3a50b 70%,
        #d47500
    );
    border: 5px solid #b56500;
    box-shadow: 0 6px 0 #914800, 0 0 20px #ffeb50;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
    cursor: pointer;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    will-change: transform;
}

.coin::before {
    content: "★";
    color: #d88700;
}

/* Niveau 5 : rouge */
.coin.level5 {
    background: radial-gradient(
        circle at 30% 25%,
        #fff0f0,
        #ff5555 45%,
        #b90000
    );
    border-color: #8b0000;
    box-shadow: 0 6px 0 #650000, 0 0 25px #ff4444;
}

.coin.level5::before {
    color: #8b0000;
}

/* Niveau 7 : bleu */
.coin.level7 {
    background: radial-gradient(
        circle at 30% 25%,
        #e0f8ff,
        #39bfff 45%,
        #0751c9
    );
    border-color: #06429b;
    box-shadow: 0 6px 0 #063276, 0 0 25px #38cfff;
}

.coin.level7::before {
    color: #063276;
}

/* Niveau 10 : arc-en-ciel */
.coin.level10 {
    background: linear-gradient(
        135deg,
        #ff3b3b,
        #ffe23b,
        #49ed65,
        #45c9ff,
        #b66cff,
        #ff55c8
    );
    border-color: white;
    box-shadow: 0 6px 0 #7c399c, 0 0 25px white;
}

.coin.level10::before {
    color: white;
}

/* Informations */
.info {
    position: absolute;
    top: 7%;
    z-index: 300;
    color: white;
    font-size: clamp(24px, 3.5vw, 55px);
    font-weight: bold;
    text-shadow: 2px 3px #704000;
    pointer-events: none;
}

#totalScore {
    left: 2%;
    top: 8%;
    font-size: clamp(15px, 2vw, 30px);
}

#score {
    left: 14%;
}

#time {
    right: 9%;
}

#level {
    position: absolute;
    bottom: 4%;
    left: 155px;
    z-index: 400;
    color: white;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 2px 2px #704000;
}

/* Bouton rejouer */
#start {
    position: absolute;
    bottom: 4%;
    left: 20px;
    z-index: 400;
    padding: 8px 15px;
    border: 3px solid #4b287e;
    border-radius: 25px;
    background: linear-gradient(#be90ff, #7040ce);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #4b287e;
}

/* Bouton niveau 1 */
#resetLevel {
    position: absolute;
    bottom: 4%;
    left: 300px;
    z-index: 400;
    padding: 8px 12px;
    border: 3px solid #4b287e;
    border-radius: 25px;
    background: #8b61df;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: none;
}

/* Bouton plein écran */
#fullscreenButton {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 500;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 2px solid white;
    border-radius: 8px;
    background: rgba(0,0,0,.45);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

/* Effets */
.explosion {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ffe45a;
    pointer-events: none;
    z-index: 200;
    animation: boom .35s ease-out forwards;
}

@keyframes boom {
    0% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(.2);
    }
    50% {
        opacity: .9;
        transform: translate(-50%,-50%) scale(2);
        box-shadow: 0 0 25px #ffe45a;
    }
    100% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(3.5);
    }
}

.plus {
    position: absolute;
    color: white;
    font-size: 32px;
    font-weight: bold;
    text-shadow: 2px 2px 4px #704000;
    pointer-events: none;
    z-index: 250;
    animation: plus .6s ease-out forwards;
}

@keyframes plus {
    0% {
        opacity: 1;
        transform: translate(-50%,-50%);
    }
    100% {
        opacity: 0;
        transform: translate(-50%,-110px);
    }
}

/* Fête */
#celebration {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translate(-50%,-50%);
    z-index: 600;
    width: 90%;
    text-align: center;
    color: white;
    font-size: clamp(25px,5vw,70px);
    font-weight: bold;
    text-shadow: 3px 3px #704000, 0 0 20px gold;
    pointer-events: none;
    display: none;
}

@media (max-width: 600px) {
    #level {
        left: 130px;
        font-size: 14px;
    }

    #resetLevel {
        left: 245px;
        font-size: 11px;
        padding: 6px 8px;
    }

    #start {
        font-size: 13px;
        padding: 7px 10px;
    }

    .coin {
        width: 60px;
        height: 60px;
        font-size: 30px;
    }
}
</style>
</head>

<body>

<div id="game">

    <img id="background" src="decor.png" alt="Décor">

    <div id="totalScore" class="info">Total : 0</div>

    <div id="score" class="info">0</div>

    <div id="time" class="info">10</div>

    <div id="level">Niveau 1</div>

    <button id="resetLevel">↩ Niveau 1</button>

    <button id="fullscreenButton">⛶</button>

    <div id="coins"></div>

    <div id="celebration"></div>

    <button id="start">▶ Démarrer</button>

</div>

<script>

let score = 0;
let totalScore = 0;
let time = 10;
let level = 1;
let playing = false;

let timer = null;
let spawnTimer = null;
let animationFrame = null;

const activeCoins = new Set();

const game = document.getElementById("game");
const layer = document.getElementById("coins");

const scoreDisplay = document.getElementById("score");
const totalScoreDisplay = document.getElementById("totalScore");
const timeDisplay = document.getElementById("time");
const levelDisplay = document.getElementById("level");

const startButton = document.getElementById("start");
const resetButton = document.getElementById("resetLevel");
const fullscreenButton = document.getElementById("fullscreenButton");
const celebration = document.getElementById("celebration");


/* AFFICHAGE */

function updateDisplay() {

    scoreDisplay.textContent = score;

    totalScoreDisplay.textContent =
        "Total : " + totalScore;

    timeDisplay.textContent = time;

    levelDisplay.textContent =
        "Niveau " + level;

}


/* DIFFICULTÉ */

function getDifficultySpeed() {

    let baseSpeed;

    if (level <= 2) {

        baseSpeed = 0.8;

    } else if (level <= 4) {

        baseSpeed = 1.3 + (level - 3) * 0.5;

    } else if (level <= 6) {

        baseSpeed = 2.5 + (level - 5) * 0.7;

    } else if (level <= 9) {

        baseSpeed = 4.2 + (level - 7) * 0.8;

    } else {

        baseSpeed = 6.8 + (level - 10) * 0.8;

    }

    return baseSpeed + Math.random() * 0.5;

}


/* NETTOYAGE */

function clearCoins() {

    activeCoins.forEach(coin => {
        coin.element.remove();
    });

    activeCoins.clear();

}


/* FÊTE */

function showCelebration(message) {

    celebration.textContent = message;

    celebration.style.display = "block";

    setTimeout(() => {
        celebration.style.display = "none";
    }, 1800);

}


/* EFFETS */

function createEffects(x, y) {

    const explosion = document.createElement("div");

    explosion.className = "explosion";

    explosion.style.left = x + "px";
    explosion.style.top = y + "px";

    layer.appendChild(explosion);

    setTimeout(() => {
        explosion.remove();
    }, 350);


    const plus = document.createElement("div");

    plus.className = "plus";

    plus.textContent = "+5 ⭐";

    plus.style.left = x + "px";
    plus.style.top = y + "px";

    layer.appendChild(plus);

    setTimeout(() => {
        plus.remove();
    }, 600);

}


/* CRÉER UNE PIÈCE */

function createCoin() {

    if (!playing || activeCoins.size >= 8) return;

    const element = document.createElement("div");

    element.className = "coin";


    if (level >= 10) {

        element.classList.add("level10");

    } else if (level >= 7) {

        element.classList.add("level7");

    } else if (level >= 5) {

        element.classList.add("level5");

    }


    const coin = {

        element: element,

        x:
            20 +
            Math.random() *
            Math.max(20, game.clientWidth - 115),

        y: -100,

        speed: getDifficultySpeed(),

        sway: 15 + Math.random() * 30,

        swaySpeed: 0.0015 + Math.random() * 0.001,

        phase: Math.random() * Math.PI * 2,

        rotation: 0,

        collected: false

    };


    element.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();
            event.stopPropagation();

            collectCoin(coin, event);

        },
        { passive: false }
    );


    layer.appendChild(element);

    activeCoins.add(coin);

}


/* COLLECTER UNE PIÈCE */

function collectCoin(coin, event) {

    if (!playing || coin.collected) return;

    coin.collected = true;

    score += 5;

    totalScore += 5;

    updateDisplay();


    const rect = game.getBoundingClientRect();

    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;


    activeCoins.delete(coin);

    coin.element.remove();

    createEffects(x, y);

}


/* ANIMATION */

function animateCoins(timestamp) {

    if (playing) {

        activeCoins.forEach(coin => {

            if (coin.collected) return;

            coin.y += coin.speed;

            const sideMove =
                Math.sin(
                    timestamp * coin.swaySpeed + coin.phase
                ) * coin.sway;

            coin.rotation += 0.6;

            coin.element.style.transform =
                `translate(
                    ${coin.x + sideMove}px,
                    ${coin.y}px
                )
                rotate(${coin.rotation}deg)`;


            if (coin.y > game.clientHeight + 100) {

                activeCoins.delete(coin);

                coin.element.remove();

            }

        });

    }

    animationFrame =
        requestAnimationFrame(animateCoins);

}


/* DÉMARRER UNE PARTIE */

function startGame() {

    resetButton.style.display = "none";

    clearInterval(timer);
    clearInterval(spawnTimer);

    cancelAnimationFrame(animationFrame);

    clearCoins();

    score = 0;
    time = 10;
    playing = true;

    updateDisplay();

    startButton.textContent = "🔄 Rejouer";


    spawnTimer = setInterval(() => {

        if (playing && activeCoins.size < 8) {
            createCoin();
        }

    }, 500);


    timer = setInterval(() => {

        time--;

        updateDisplay();

        if (time <= 0) {
            endGame();
        }

    }, 1000);


    animationFrame =
        requestAnimationFrame(animateCoins);

}


/* FIN DE PARTIE */

function endGame() {

    playing = false;

    clearInterval(timer);
    clearInterval(spawnTimer);

    cancelAnimationFrame(animationFrame);

    clearCoins();

    level++;

    updateDisplay();

    resetButton.style.display = "block";


    if (level === 5) {

        showCelebration("🔴 NIVEAU 5 ! 🔴");

    }

    if (level === 7) {

        showCelebration("🔵 NIVEAU 7 ! 🔵");

    }

    if (level === 10) {

        showCelebration("🌈 NIVEAU 10 ! 🌈");

    }


    setTimeout(() => {

        alert(
            "⏰ Temps écoulé !\n\n" +
            "⭐ Score : " + score +
            "\n🏆 Prochain niveau : " + level +
            "\n💰 Score total : " + totalScore
        );

    }, 150);

}


/* RETOUR AU NIVEAU 1 */

resetButton.addEventListener("click", () => {

    playing = false;

    clearInterval(timer);
    clearInterval(spawnTimer);

    cancelAnimationFrame(animationFrame);

    clearCoins();

    level = 1;
    score = 0;
    totalScore = 0;
    time = 10;

    updateDisplay();

    startButton.textContent = "▶ Démarrer";

    resetButton.style.display = "none";

});


/* REJOUER */

startButton.addEventListener("click", startGame);


/* PLEIN ÉCRAN */

fullscreenButton.addEventListener("click", async () => {

    try {

        if (!document.fullscreenElement) {

            await document.documentElement.requestFullscreen();

        } else {

            await document.exitFullscreen();

        }

    } catch (error) {

        console.log("Le plein écran n'est pas disponible.");

    }

});


/* INITIALISATION */

updateDisplay();

</script>

</body>
</html>
